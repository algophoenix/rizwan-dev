name: Portfolio Maintenance

on:
  schedule:
    - cron: "0 3 * * 1-5"   # Weekdays only
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Random working-hour delay (IST 9AM–8PM)
        run: |
          DELAY=$(( (RANDOM % 39600) + 12600 ))
          sleep $DELAY

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Random skip (30% chance)
        id: skip
        run: |
          if [ $((RANDOM % 10)) -lt 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if skipped
        if: steps.skip.outputs.skip == 'true'
        run: exit 0

      - name: Choose realistic task
        id: task
        run: |
          TASKS=("tailwind" "css" "readme" "component" "version")
          choice=${TASKS[$RANDOM % ${#TASKS[@]}]}
          echo "task=$choice" >> $GITHUB_OUTPUT

      ##############################################
      # Tailwind refinement
      ##############################################
      - name: Refine tailwind config
        if: steps.task.outputs.task == 'tailwind'
        run: |
          if [ -f tailwind.config.js ]; then
            echo "// refined spacing scale $(date +%Y-%m-%d)" >> tailwind.config.js
          fi

      ##############################################
      # CSS tweak
      ##############################################
      - name: CSS refinement
        if: steps.task.outputs.task == 'css'
        run: |
          if [ -f src/index.css ]; then
            echo "/* improved spacing rhythm $(date +%Y-%m-%d) */" >> src/index.css
          fi

      ##############################################
      # README improvement
      ##############################################
      - name: README refinement
        if: steps.task.outputs.task == 'readme'
        run: |
          echo "" >> README.md
          echo "### Minor documentation update - $(date +%Y-%m-%d)" >> README.md

      ##############################################
      # Component improvement
      ##############################################
      - name: Component internal improvement
        if: steps.task.outputs.task == 'component'
        run: |
          FILE=$(find src/components -name "*.tsx" | head -n 1)
          if [ -n "$FILE" ]; then
            echo "// TODO: future optimization $(date +%Y-%m-%d)" >> $FILE
          fi

      ##############################################
      # Version bump
      ##############################################
      - name: Patch version bump
        if: steps.task.outputs.task == 'version'
        run: |
          if [ -f package.json ]; then
            npm version patch --no-git-tag-version
          fi

      ##############################################
      # Commit message generator
      ##############################################
      - name: Generate MR commit message
        id: commitmsg
        run: |
          LAST=$(git log --pretty=format:"%s" -n 100 | grep -oP '\[MR\] - P\K[0-9]+' | sort -n | tail -1)

          if [ -z "$LAST" ]; then
            NEXT=1
          else
            NEXT=$((LAST + 1))
          fi

          PADDED=$(printf "%03d" $NEXT)

          DESCRIPTIONS=(
            "UI refinement"
            "Layout optimization"
            "Component enhancement"
            "Code cleanup"
            "Performance improvement"
            "Styling improvement"
            "Documentation update"
            "Configuration refinement"
          )

          DESC=${DESCRIPTIONS[$RANDOM % ${#DESCRIPTIONS[@]}]}

          echo "message=[MR] - P$PADDED | $DESC" >> $GITHUB_OUTPUT

      - name: Commit and push
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit -m "${{ steps.commitmsg.outputs.message }}" || echo "No changes"
          git push
